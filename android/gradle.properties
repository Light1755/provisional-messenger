org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# This machine has ~7 GB of RAM and usually runs the Android emulator. The
# template's 8G heap + 4G metaspace crashed the Gradle daemon with a native
# mmap failure, so keep both the Gradle and Kotlin daemons small.
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround for file_picker's Kotlin compiler cache crash at the end of clean
# builds ("Storage for ... class-fq-name-to-source.tab is already registered").
kotlin.incremental=false
