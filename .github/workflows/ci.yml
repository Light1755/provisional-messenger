name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_SUPABASE_URL: https://cjcfppidlsezrvzerikf.supabase.co

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || '' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_KEY || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate baked Supabase config
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL is empty. Set it as an Actions variable or secret."
            exit 1
          fi
          if [ "$SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL does not match the expected project URL."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY is empty. Set it as an Actions variable or secret."
            exit 1
          fi
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *)
              # Legacy anon JWT: three base64url segments with role=anon.
              if ! printf '%s' "$SUPABASE_ANON_KEY" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
                echo "::error::SUPABASE_ANON_KEY must start with sb_publishable_ or be a valid anon JWT."
                exit 1
              fi
              payload="$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')"
              case $((${#payload} % 4)) in
                2) payload="${payload}==" ;;
                3) payload="${payload}=" ;;
              esac
              role="$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.role // empty' || true)"
              if [ "$role" != "anon" ]; then
                echo "::error::SUPABASE_ANON_KEY JWT must have role=anon."
                exit 1
              fi
              ;;
          esac
          echo "Supabase URL and key shape validated; values not logged."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Compute base href
        id: base
        env:
          PAGES_BASE_HREF: ${{ vars.PAGES_BASE_HREF || '' }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -z "$repo" ]; then
            echo "::error::Could not derive repository name from GITHUB_REPOSITORY."
            exit 1
          fi
          case "$repo" in
            *.github.io) href='/' ;;
            *) href="/$repo/" ;;
          esac
          if [ -n "$PAGES_BASE_HREF" ]; then
            href="$PAGES_BASE_HREF"
          fi
          case "$href" in
            /*/) ;;
            *) echo "::error::Base href must start and end with '/': $href"; exit 1 ;;
          esac
          echo "href=$href" >> "$GITHUB_OUTPUT"
          echo "Base href: $href"

      - name: Build web
        env:
          BASE_HREF: ${{ steps.base.outputs.href }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify web output
        env:
          BASE_HREF: ${{ steps.base.outputs.href }}
        run: |
          set -euo pipefail
          test -d build/web || { echo "::error::build/web is missing"; exit 1; }
          test -s build/web/main.dart.js || { echo "::error::main.dart.js is missing or empty"; exit 1; }
          test -s build/web/index.html || { echo "::error::index.html is missing or empty"; exit 1; }
          grep -Fq "$BASE_HREF" build/web/index.html || { echo "::error::index.html does not contain the expected base href"; exit 1; }
          file_count="$(find build/web -type f | wc -l)"
          if [ "$file_count" -lt 5 ]; then
            echo "::error::build/web has too few files: $file_count"
            exit 1
          fi
          total_bytes="$(find build/web -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')"
          if [ "$total_bytes" -lt 100000 ]; then
            echo "::error::build/web is too small: $total_bytes bytes"
            exit 1
          fi
          echo "Web output: $file_count files, $total_bytes bytes, base $BASE_HREF"
          sha256sum build/web/main.dart.js

  build-android:
    name: Build signed APK and AAB
    # Release artifacts need the durable signing secrets, which fork PRs cannot read.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || '' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_KEY || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate baked Supabase config
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL is empty. Set it as an Actions variable or secret."
            exit 1
          fi
          if [ "$SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL does not match the expected project URL."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY is empty. Set it as an Actions variable or secret."
            exit 1
          fi
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *)
              if ! printf '%s' "$SUPABASE_ANON_KEY" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
                echo "::error::SUPABASE_ANON_KEY must start with sb_publishable_ or be a valid anon JWT."
                exit 1
              fi
              payload="$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')"
              case $((${#payload} % 4)) in
                2) payload="${payload}==" ;;
                3) payload="${payload}=" ;;
              esac
              role="$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.role // empty' || true)"
              if [ "$role" != "anon" ]; then
                echo "::error::SUPABASE_ANON_KEY JWT must have role=anon."
                exit 1
              fi
              ;;
          esac
          echo "Supabase URL and key shape validated; values not logged."

      # JDK 17 matches the pinned Gradle 9.5 / AGP 9.3 toolchain in android/.
      # lintVital* is disabled in android/build.gradle.kts because it crashes on
      # Java 17 in this toolchain; Dart analysis and tests cover app correctness.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release signing secret $name."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/provisional-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore" || { echo "::error::Decoded keystore is empty"; exit 1; }
          export KEYSTORE_FILE="$keystore"
          export KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify Android artifacts
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          aab='build/app/outputs/bundle/release/app-release.aab'
          for artifact in "$apk" "$aab"; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing or empty artifact: $artifact"
              exit 1
            fi
            size="$(stat -c %s "$artifact")"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::Artifact is too small: $artifact ($size bytes)"
              exit 1
            fi
            echo "$artifact: $size bytes"
            sha256sum "$artifact"
          done
